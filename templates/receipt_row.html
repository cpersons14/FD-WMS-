<tr class="receipt-row"><td><label>Part number<input name="sku" value="{{ row.sku }}" list="receipt-parts" maxlength="100" autocomplete="off"></label><small class="part-description"></small></td>
<td><label>Putaway location<input name="location" value="{{ row.location }}" list="receipt-locations" maxlength="100"></label><small class="bin-state"></small></td>
<td><label>Quantity<input name="quantity" value="{{ row.quantity }}" type="number" min="0" step="1"></label><label>Unit<select name="unit"><option value="EA">Eaches</option><option value="CASE" {% if row.unit == 'CASE' %}selected{% endif %}>Cases</option><option value="PALLET" {% if row.unit == 'PALLET' %}selected{% endif %}>Pallets</option></select></label></td>
<td><label>Loose eaches<input name="loose_eaches" value="{{ row.loose_eaches|default:'0' }}" type="number" min="0" step="1"></label><small class="pack-info"></small><input type="hidden" name="case_pack" value="{{ row.case_pack }}"><input type="hidden" name="pallet_cases" value="{{ row.pallet_cases }}"><button type="button" class="secondary refresh-pack" hidden>Use current pack</button></td>
<td><strong class="each-total">—</strong><small>Total eaches</small><label>Condition<select name="damaged"><option value="0">Good</option><option value="1" {% if row.damaged %}selected{% endif %}>Damaged / hold</option></select></label></td>
<td><label>Line note<input name="note" value="{{ row.note }}" maxlength="500"></label><button type="button" class="secondary remove-receipt-row">Remove row</button></td></tr>
