<div class="pagination"><span>{{ page.paginator.count }} records · Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a href="?q={{ q|urlencode }}&kind={{ kind|urlencode }}&counted={{ counted|urlencode }}&status={{ status|urlencode }}&page={{ page.previous_page_number }}">← Previous</a>{% endif %}{% if page.has_next %}<a href="?q={{ q|urlencode }}&kind={{ kind|urlencode }}&counted={{ counted|urlencode }}&status={{ status|urlencode }}&page={{ page.next_page_number }}">Next →</a>{% endif %}</div></div>
