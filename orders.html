{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">CUSTOMER REQUESTS</p><h1>Orders</h1><p>Track requests from submission through shipment.</p></div><a class="button" href="{% url 'new_order' %}">+ New order</a></div><form class="filters"><input name="q" value="{{ q }}" placeholder="Search store, reference, or tracking" aria-label="Search orders"><select name="status" aria-label="Order status"><option value="">All statuses</option><option value="SUBMITTED" {% if status == 'SUBMITTED' %}selected{% endif %}>Submitted</option><option value="PARTIAL" {% if status == 'PARTIAL' %}selected{% endif %}>Partial / backordered</option><option value="PACKED" {% if status == 'PACKED' %}selected{% endif %}>Packed</option><option value="PICKED" {% if status == 'PICKED' %}selected{% endif %}>Picked</option><option value="SHIPPED" {% if status == 'SHIPPED' %}selected{% endif %}>Shipped</option><option value="CANCELLED" {% if status == 'CANCELLED' %}selected{% endif %}>Cancelled</option></select><button>Search</button></form><section class="panel flush">{% include 'order_table.html' with orders=page %}</section>{% include 'pagination.html' %}{% endblock %}
