name: WMS quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wms-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-quality:
    name: PostgreSQL release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wms_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: wms_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wms_test -d wms_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      WMS_TEST_DATABASE_URL: postgresql://wms_test:disposable-ci-only@127.0.0.1:5432/wms_test_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static analysis and formatting
        run: |
          ruff check config warehouse scripts manage.py
          ruff format --check config warehouse scripts manage.py
          python scripts/check_repository.py
      - name: PostgreSQL tests (skips fail)
        run: |
          coverage run manage.py test warehouse --noinput
          coverage report
          coverage xml
      - name: Validate schema and production settings
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py setup_wms
          python manage.py check --deploy --fail-level WARNING --settings=config.settings
          python manage.py collectstatic --noinput
        env:
          DEBUG: "0"
          SECRET_KEY: ci-only-long-random-shaped-0123456789abcdefghijklmnopqrstuvwxyz
          DATABASE_URL: postgresql://wms_test:disposable-ci-only@127.0.0.1:5432/wms_test_ci
          DB_SSLMODE: disable
          ALLOWED_HOSTS: localhost,127.0.0.1
          TRUST_PROXY: "1"
      - name: Store coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
