databases:
  - name: s3pl-fd-db
    plan: 0.5c-1g
    region: ohio
    databaseName: s3pl_fd
    user: s3pl_fd
    diskSizeGB: 5
    ipAllowList: []
services:
  - type: web
    name: s3pl-fd-wms
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput && python manage.py setup_wms
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        fromDatabase:
          name: s3pl-fd-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: TRUST_PROXY
        value: "1"
