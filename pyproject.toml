[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]
# Legacy modules use local imports to break existing cycles. Refactor separately.
ignore = ["E402"]

[tool.coverage.run]
branch = true
source = ["warehouse", "config"]
omit = ["*/migrations/*", "*/test*.py", "config/wsgi.py", "config/test_settings.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
